name: Build MHI Pro
on: [push]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar Libs
        run: pip install eel pyinstaller bottle future setuptools

      - name: Compilar EXE
        run: |
          python -m eel app.py web --onefile --noconsole --name "Manutencao_MHI"

      - name: Criar Instalador Profissional
        shell: powershell
        run: |
          $iss = @"
          [Setup]
          AppName=Manutencao MHI
          AppVersion=1.0
          DefaultDirName={autopf}\ManutencaoMHI
          OutputDir=out
          OutputBaseFilename=Instalador_MHI
          [Files]
          Source: "dist\Manutencao_MHI.exe"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{autodesktop}\Manutencao MHI"; Filename: "{app}\Manutencao_MHI.exe"
          Name: "{group}\Manutencao MHI"; Filename: "{app}\Manutencao_MHI.exe"
          "@
          $iss | Out-File -FilePath setup.iss -Encoding utf8
          iscc setup.iss

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-MHI
          path: out/Instalador_MHI.exe
