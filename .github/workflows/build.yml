name: Gerar Instalador Windows 2026

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install setuptools eel pyinstaller bottle future

      - name: Criar Pasta Web se não existir (Correção de Estrutura)
        run: |
          if (!(Test-Path web)) {
            mkdir web
            move index.html web/
            move main.js web/
            move style.css web/
          }

      - name: Compilar EXE
        run: |
          python -m eel app.py web --onefile --noconsole --name "GestaoManutencaoPro" --workpath ./build --distpath ./dist

      - name: Upload do Executável
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Manutencao-Pro
          path: dist/GestaoManutencaoPro.exe
