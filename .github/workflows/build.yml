name: Gerar Instalador Windows 2026

on: [push]

env:
  # Resolve o aviso do Node.js 24 exigido em 2026
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Atualizado para a versão mais estável do runner em 2026
    runs-on: windows-2025

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências Críticas
        run: |
          python -m pip install --upgrade pip
          pip install eel pyinstaller bottle future

      - name: Debug - Listar Arquivos
        run: |
          echo "Verificando arquivos no diretório raiz:"
          dir
          echo "Verificando pasta web:"
          if (Test-Path web) { dir web } else { echo "ERRO: Pasta 'web' não encontrada!" }

      - name: Compilar EXE (Modo Robusto)
        run: |
          python -m eel app.py web --onefile --noconsole --name "GestaoManutencaoPro" --workpath ./build --distpath ./dist

      - name: Upload do Executável
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Manutencao-2026
          path: dist/GestaoManutencaoPro.exe
          retention-days: 5
