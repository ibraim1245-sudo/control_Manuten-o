name: Build MHI Pro 2026
on: [push]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install eel pyinstaller bottle future setuptools

      - name: Preparar Pasta Web
        shell: powershell
        run: |
          # Cria a pasta web se ela não existir
          if (!(Test-Path "web")) { New-Item -ItemType Directory -Path "web" }
          # Move apenas o index.html (que contém tudo) para dentro da pasta web
          if (Test-Path "index.html") { Move-Item "index.html" -Destination "web" -Force }

      - name: Compilar EXE
        run: |
          python -m eel app.py web --onefile --noconsole --name "Manutencao_MHI"

      - name: Criar Instalador com Atalho
        shell: powershell
        run: |
          $iss = @"
          [Setup]
          AppName=Manutencao MHI
          AppVersion=2.0
          DefaultDirName={autopf}\ManutencaoMHI
          OutputDir=installer_out
          OutputBaseFilename=Instalador_MHI
          [Files]
          Source: "dist\Manutencao_MHI.exe"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{autodesktop}\Manutencao MHI"; Filename: "{app}\Manutencao_MHI.exe"
          Name: "{group}\Manutencao MHI"; Filename: "{app}\Manutencao_MHI.exe"
          [Run]
          Filename: "{app}\Manutencao_MHI.exe"; Description: "Lançar Sistema"; Flags: nowait postinstall
          "@
          $iss | Out-File -FilePath setup.iss -Encoding utf8
          iscc setup.iss

      - name: Upload do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-MHI-Final
          path: installer_out/Instalador_MHI.exe
