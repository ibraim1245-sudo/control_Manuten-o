name: Gerar Instalador MHI Pro

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Libs
        run: |
          pip install eel pyinstaller bottle future

      - name: Compilar com PyInstaller
        run: |
          python -m eel app.py web --onefile --noconsole --name "ManutencaoPro_MHI"

      - name: Criar Instalador com Inno Setup
        # O GitHub Windows Runner já tem o Inno Setup instalado!
        run: |
          echo '[Setup]' > setup.iss
          echo 'AppName=ManutencaoPro MHI' >> setup.iss
          echo 'AppVersion=1.0' >> setup.iss
          echo 'DefaultDirName={pf}\ManutencaoProMHI' >> setup.iss
          echo 'OutputDir=output' >> setup.iss
          echo 'OutputBaseFilename=Instalador_MHI' >> setup.iss
          echo '[Files]' >> setup.iss
          echo 'Source: "dist\ManutencaoPro_MHI.exe"; DestDir: "{app}"' >> setup.iss
          echo '[Icons]' >> setup.iss
          echo 'Name: "{commondesktop}\ManutencaoPro MHI"; Filename: "{app}\ManutencaoPro_MHI.exe"' >> setup.iss
          iscc setup.iss

      - name: Upload do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Windows
          path: output/Instalador_MHI.exe
