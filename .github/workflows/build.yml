name: Gerar Instalador Windows

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install eel pyinstaller

      - name: Compilar EXE
        run: |
          python -m eel app.py web --onefile --noconsole --name "GestaoManutencaoPro"

      - name: Upload do Executável
        uses: actions/upload-artifact@v4
        with:
          name: Sistema-Manutencao-Windows
          path: dist/GestaoManutencaoPro.exe
