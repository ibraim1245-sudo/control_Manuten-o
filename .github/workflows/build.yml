name: Gerar Instalador Manutencao MHI

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel eel pyinstaller bottle future

      - name: Organizar Arquivos
        shell: powershell
        run: |
          if (Test-Path "index.html") {
            if (!(Test-Path "web")) { New-Item -ItemType Directory -Path "web" }
            Move-Item "index.html", "main.js", "style.css" -Destination "web" -ErrorAction SilentlyContinue
          }

      - name: Compilar EXE
        shell: powershell
        run: |
          python -m eel app.py web --onefile --noconsole --name "Manutencao_MHI"

      - name: Upload do Executável
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Manutencao-MHI-Windows
          path: dist/Manutencao_MHI.exe
