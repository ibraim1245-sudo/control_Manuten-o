name: Gerar Instalador Manutencao MHI 2026

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel eel pyinstaller bottle future

      - name: Organizar Estrutura (Cria pasta web se não existir)
        shell: powershell
        run: |
          # Verifica se os arquivos estão soltos na raiz (como no seu log)
          if (Test-Path "index.html") {
              echo "Arquivos soltos detectados. Criando pasta web e movendo..."
              if (!(Test-Path "web")) { New-Item -ItemType Directory -Path "web" }
              Move-Item "index.html", "main.js", "style.css" -Destination "web" -Force
          }
          dir -Recurse # Mostra a estrutura corrigida no log

      - name: Compilar EXE Único
        shell: powershell
        run: |
          python -m eel app.py web --onefile --noconsole --name "Manutencao_MHI"

      - name: Criar Script do Instalador (Inno Setup)
        shell: powershell
        run: |
          $issContent = @"
          [Setup]
          AppName=Manutencao MHI
          AppVersion=2.0
          DefaultDirName={autopf}\ManutencaoMHI
          DefaultGroupName=ManutencaoMHI
          OutputDir=installer_output
          OutputBaseFilename=Instalador_Manutencao_MHI
          Compression=lzma
          SolidCompression=yes
          PrivilegesRequired=admin
          [Tasks]
          Name: "desktopicon"; Description: "Criar atalho na Area de Trabalho"; GroupDescription: "Icones Adicionais:"; Flags: unchecked
          [Files]
          Source: "dist\Manutencao_MHI.exe"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{group}\Manutencao MHI"; Filename: "{app}\Manutencao_MHI.exe"
          Name: "{autodesktop}\Manutencao MHI"; Filename: "{app}\Manutencao_MHI.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}\Manutencao_MHI.exe"; Description: "Lancar Manutencao MHI"; Flags: nowait postinstall skipifsilent
          "@
          $issContent | Out-File -FilePath setup.iss -Encoding utf8

      - name: Gerar Instalador .EXE Final
        run: iscc setup.iss

      - name: Upload do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Manutencao-MHI
          path: installer_output/Instalador_Manutencao_MHI.exe
