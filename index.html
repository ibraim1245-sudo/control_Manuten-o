<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>ManutençãoPro MHI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body class="dark-mode">
    <aside class="sidebar">
        <div class="header-logo">
            <i class="fas fa-tools"></i> 
            <div><strong>ManutençãoPro_MHI</strong><br><small>CMMS</small></div>
        </div>
        <nav>
            <button onclick="tab('dash')" class="active"><i class="fas fa-th-large"></i> Painel</button>
            <button onclick="tab('ativos')"><i class="fas fa-microchip"></i> Ativos</button>
            <button onclick="tab('os')"><i class="fas fa-file-invoice"></i> Ordens de Serviço</button>
            <button onclick="tab('prev')"><i class="fas fa-calendar-check"></i> Preventiva</button>
            <button onclick="tab('inv')"><i class="fas fa-boxes"></i> Inventário</button>
            <button onclick="tab('rep')"><i class="fas fa-chart-bar"></i> Relatórios</button>
        </nav>
    </aside>

    <main class="main-content">
        <section id="tab-dash" class="content-pane">
            <header><h1>Painel</h1><p>Visão geral do sistema de manutenção</p></header>
            
            <div class="kpi-grid">
                <div class="kpi-card"><span>Ativos Totais</span><h2 id="k-ativos">0</h2></div>
                <div class="kpi-card"><span>Ordens Abertas</span><h2 id="k-os">0</h2></div>
                <div class="kpi-card"><span>Custo Total</span><h2 id="k-custo">R$ 0,00</h2></div>
                <div class="kpi-card"><span>Estoque Baixo</span><h2>0</h2></div>
            </div>

            <div class="charts-container">
                <div class="chart-box"><h3>Ordens por Status</h3><canvas id="chartStatus"></canvas></div>
                <div class="chart-box"><h3>Ordens por Prioridade</h3><canvas id="chartPrio"></canvas></div>
            </div>
        </section>
    </main>
    <script src="main.js"></script>
</body>
</html>
