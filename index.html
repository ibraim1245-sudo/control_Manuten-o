<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Manutenção MHI | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-microchip"></i> <span>MHI PRO</span>
        </div>
        <nav>
            <button onclick="showTab('dash')" class="active" id="btn-dash"><i class="fas fa-chart-pie"></i> Dashboard</button>
            <button onclick="showTab('ativos')" id="btn-ativos"><i class="fas fa-cogs"></i> Inventário de Ativos</button>
        </nav>
        <div class="version">Manutenção MHI v1.0</div>
    </div>

    <main class="content">
        <section id="tab-dash" class="tab-content">
            <header>
                <h1>Painel de Controle</h1>
                <span id="date-display"></span>
            </header>

            <div class="kpi-container">
                <div class="kpi-card">
                    <div class="kpi-icon blue"><i class="fas fa-list"></i></div>
                    <div><h3>Total Ativos</h3><h2 id="count-total">0</h2></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon green"><i class="fas fa-check"></i></div>
                    <div><h3>Operacionais</h3><h2 id="count-op">0</h2></div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-icon yellow"><i class="fas fa-wrench"></i></div>
                    <div><h3>Em Manutenção</h3><h2 id="count-manut">0</h2></div>
                </div>
            </div>

            <div class="dashboard-details">
                <div class="chart-card">
                    <h3>Saúde Geral da Planta</h3>
                    <div class="progress-container">
                        <div id="health-bar" class="progress-bar"></div>
                    </div>
                    <p id="health-label">0% Funcional</p>
                </div>
            </div>
        </section>

        <section id="tab-ativos" class="tab-content" style="display:none;">
            <div class="action-bar">
                <h1>Gestão de Equipamentos</h1>
                <button class="btn-main" onclick="toggleModal(true)"><i class="fas fa-plus"></i> Novo Ativo</button>
            </div>
            
            <div class="table-holder">
                <table>
                    <thead>
                        <tr>
                            <th>Ativo</th>
                            <th>Série</th>
                            <th>Prioridade</th>
                            <th>Status</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-corpo"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-form" class="modal">
        <div class="modal-body">
            <h2>Cadastrar Novo Ativo - MHI</h2>
            <div class="form-group">
                <input type="text" id="name" placeholder="Nome da Máquina/Ferramenta">
                <input type="text" id="serial" placeholder="Número de Série">
                <select id="priority">
                    <option value="Alta">🔴 Alta Prioridade</option>
                    <option value="Media">🟡 Média</option>
                    <option value="Baixa">🟢 Baixa</option>
                </select>
                <select id="status">
                    <option value="Operacional">Operacional</option>
                    <option value="Manutenção">Em Manutenção</option>
                </select>
            </div>
            <div class="modal-btns">
                <button onclick="toggleModal(false)" class="btn-cancel">Cancelar</button>
                <button onclick="cadastrar()" class="btn-save">Salvar Equipamento</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
